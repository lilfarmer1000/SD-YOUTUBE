<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سودان توب | SudanTube - منصة الفيديوهات السودانية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #121212; color: #f8fafc; }
        .bg-sudanese-brown { background-color: #C85A32; } /* البني الفخاري / تيراكوتا */
        .bg-sudanese-gold { background-color: #D4AF37; }  /* الذهبي النوبي */
        .text-sudanese-gold { color: #D4AF37; }
        .border-sudanese-gold { border-color: #D4AF37; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- Header مع الهوية السودانية -->
    <header class="bg-slate-900 border-b-2 border-sudanese-gold p-4 flex justify-between items-center sticky top-0 z-50 shadow-lg">
        <div class="flex items-center space-x-3 space-x-reverse">
            <div class="w-11 h-11 bg-sudanese-brown rounded-full flex items-center justify-center font-bold text-xl border-2 border-sudanese-gold shadow">س</div>
            <div>
                <h1 class="text-2xl font-bold text-sudanese-gold tracking-wide">سودان توب</h1>
                <p class="text-xs text-slate-400">منصة الإبداع والثقافة السودانية</p>
            </div>
        </div>
        
        <div class="w-1/3">
            <input type="text" placeholder="ابحث في تراث وفيديوهات السودان..." class="w-full bg-slate-800 text-white px-4 py-2 rounded-full border border-slate-700 focus:outline-none focus:border-amber-500 text-sm">
        </div>

        <button class="bg-sudanese-brown hover:bg-orange-700 text-white px-5 py-2 rounded-full font-semibold transition shadow">رفع فيديو</button>
    </header>

    <!-- Main Content -->
    <main class="flex-grow p-6 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <div class="bg-slate-800 rounded-xl overflow-hidden border border-slate-700 shadow-md hover:border-amber-500 transition cursor-pointer">
            <div class="h-44 bg-amber-950 flex items-center justify-center text-4xl border-b border-amber-900/50">🎥</div>
            <div class="p-4">
                <h3 class="font-bold text-lg text-amber-100">سهرات الحقيبة والتراث النوبي</h3>
                <p class="text-slate-400 text-sm mt-1">قناة التراث السوداني • 3.4 ألف مشاهدة</p>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-center py-4 text-xs text-slate-500 border-t border-slate-800">
        جميع الحقوق محفوظة - سودان توب 2026
    </footer>
</body>
</html>
